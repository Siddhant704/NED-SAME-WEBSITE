<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer Dashboard — Nedlloyd Logistics</title>
<link rel="stylesheet" href="/addons/nedlloyd.css">
<style>
:root{--ink:#111;--soft:#666;--line:#e6e6e6;--bg:#f4f4f4;--card:#fff;--orange:#FF6A00;--navy:#0B2A5B}
html[data-nl-theme="blue"]{--ink:#0B2A5B;--navy:#0B2A5B}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit}
.top{background:var(--ink);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top b{letter-spacing:.06em;font-size:15px}.top small{opacity:.6;margin-left:10px}.top nav a{color:#fff;opacity:.8;margin-left:16px;text-decoration:none;font-size:13px}.top nav a:hover{opacity:1}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}h2{font-size:16px;margin:24px 0 10px}.sub{color:var(--soft);margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.kpi b{display:block;font-size:30px;letter-spacing:-.02em}.kpi span{color:var(--soft);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{background:#fafafa;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}tr:hover td{background:#fcfcfc}
.job{font-weight:700;cursor:pointer}.bar{display:flex;gap:2px}.bar i{flex:1;height:6px;background:#e5e5e5;border-radius:3px}.bar i.d{background:var(--ink)}.bar i.c{background:var(--orange)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#eee}.pill.o{background:#ffe8d6;color:#a33b00}.pill.g{background:#e3f6e8;color:#0f6b2e}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:600 13px inherit;cursor:pointer}.btn.o{background:var(--orange)}.btn.s{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.xs{padding:6px 10px;font-size:12px}
.login{max-width:420px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px}.login label{display:block;font-size:12px;color:var(--soft);margin:12px 0 4px}.login input{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px 12px;font:14px inherit}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.roles button{border:1px solid var(--line);background:#fafafa;border-radius:10px;padding:8px;font:12px inherit;cursor:pointer;text-align:left}.roles button b{display:block}
.detail{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.detail.open{display:flex}.detail .card{background:#fff;border-radius:18px;padding:24px;width:720px;max-width:100%;max-height:92vh;overflow:auto;position:relative}.detail .x{position:absolute;right:14px;top:8px;border:0;background:none;font-size:24px;cursor:pointer}
.tl{display:grid;grid-template-columns:32px 1fr auto;gap:8px 12px;margin-top:12px}.tl i{width:28px;height:28px;border-radius:50%;background:#e5e5e5;display:flex;align-items:center;justify-content:center;font:700 12px inherit;font-style:normal}.tl i.d{background:var(--ink);color:#fff}.tl i.c{background:var(--orange);color:#fff}.tl .doc{font-size:12px;color:var(--soft)}.tl .doc a{color:var(--orange);font-weight:600;text-decoration:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 label{display:flex;flex-direction:column;font-size:12px;color:var(--soft);gap:4px}.grid2 input,.grid2 select{border:1px solid #ddd;border-radius:10px;padding:9px 10px;font:13px inherit}
.tabs{display:flex;gap:6px;margin:18px 0 10px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:600 12px inherit;cursor:pointer}.tabs button.on{background:var(--ink);color:#fff}
.hidden{display:none}.muted{color:var(--soft);font-size:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}.top nav{display:none}th:nth-child(4),td:nth-child(4){display:none}}
@media print{.top,.tabs,#kpis,#panel-jobs,#nf,.x{display:none!important}.detail{position:static;background:none;display:block!important}.detail .card{box-shadow:none;max-height:none}}
</style></head><body>
<div class="top"><div><b>NEDLLOYD</b><small>Customer Dashboard</small></div><nav><a href="/nedlloydgroup.com/">Website</a><a href="/nedlloydgroup.com/tracking.html">Tracking guide</a><a href="/nedlloydgroup.com/contact.html">Contact</a><a href="#" id="bell" class="hidden" title="Updates in last 24h">🔔 <span id="belln">0</span></a><a href="#" id="pw" class="hidden">Password</a><a href="#" id="logout" class="hidden">Sign out</a></nav></div>
<div class="wrap">
 <div id="login" class="login"><h1>Sign in</h1><p class="sub">Live shipment status, milestones and documents.</p>
  <label>User ID</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password">
  <p id="err" class="muted" style="color:#c00"></p><button class="btn o" id="go" style="width:100%">Sign in</button>
  <p class="muted" style="margin-top:14px">Demo accounts (click to fill):</p><div class="roles">
   <button data-u="admin"><b>Nedlloyd Admin</b>all clients, MIS, leads</button><button data-u="client"><b>Client</b>own shipments, manage customers</button>
   <button data-u="customer"><b>Client's Customer</b>read-only tracking</button><button data-u="employee"><b>Employee</b>update milestones</button></div></div>
 <div id="app" class="hidden">
  <h1 id="hello"></h1><p class="sub" id="role"></p>
  <div class="cards" id="kpis"></div>
  <div class="tabs" id="tabs"></div>
  <div id="panel-jobs"><h2>Shipments <input id="jf" placeholder="Filter by job, client, route, mode…" style="margin-left:12px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:13px inherit;width:280px"> <select id="js" style="padding:7px;border:1px solid var(--line);border-radius:8px;font:13px inherit"><option value="">All status</option><option value="open">Open</option><option value="transit">In transit</option><option value="delivered">Delivered</option></select> <a href="#" id="csv" class="btn s xs" style="float:right">⬇ Export CSV</a></h2><div id="jobs"></div></div>
  <div id="panel-leads" class="hidden"><h2>Quote requests (leads)</h2><div id="leads"></div></div>
  <div id="panel-new" class="hidden"><h2>Create job</h2><form id="newjob" class="grid2"><label>Client<input name="client" required></label><label>Customer (optional)<input name="customer"></label><label>Origin<input name="origin" required></label><label>Destination<input name="destination" required></label><label>Mode<select name="mode"><option>Air · Freight</option><option>Air · Charter</option><option>Sea · FCL</option><option>Sea · LCL</option><option>Sea · Breakbulk</option><option>Sea · RO/RO</option><option>Land · Road</option><option>Land · Rail</option><option>Project · Heavy Lift</option></select></label><label>Cargo<input name="cargo"></label><label style="grid-column:1/-1"><button class="btn o">Create job →</button></label></form></div>
  <div id="panel-customers" class="hidden"><h2>Your customers' access</h2><div id="customers"></div><form id="newcust" class="grid2" style="margin-top:12px"><label>Name<input name="name" required></label><label>User ID<input name="username" required></label><label>Password<input name="password" required></label><label style="grid-column:1/-1"><button class="btn">Give read-only access →</button></label></form></div>
  <div id="panel-mis" class="hidden"><h2>MIS</h2><div id="mis"></div></div>
 </div>
</div>
<div class="detail" id="detail"><div class="card"><button class="x">×</button><div id="dbody"></div></div></div>
<script>
var T=localStorage.getItem('nl-tok'),U=null,DATA=null;
var api=function(p,o){o=o||{};o.headers=Object.assign({'Content-Type':'application/json'},T?{'Authorization':'Bearer '+T}:{});if(o.body)o.body=JSON.stringify(o.body);return fetch('/api/'+p,o).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j;});});};
var $=function(s){return document.querySelector(s);};
document.querySelectorAll('.roles button').forEach(function(b){b.onclick=function(){$('#u').value=b.dataset.u;$('#p').value=b.dataset.u;};});
$('#go').onclick=function(){api('login',{method:'POST',body:{username:$('#u').value,password:$('#p').value}}).then(function(j){T=j.token;localStorage.setItem('nl-tok',T);boot();}).catch(function(e){$('#err').textContent=e.error||'Login failed';});};
$('#p').onkeydown=function(e){if(e.key==='Enter')$('#go').click();};
$('#logout').onclick=function(e){e.preventDefault();localStorage.removeItem('nl-tok');location.reload();};
function boot(){api('me').then(function(j){if(!j.user){$('#login').classList.remove('hidden');return;}U=j.user;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#bell').classList.remove('hidden');$('#pw').classList.remove('hidden');window.loadUpdates=function(){api('updates').then(function(j){$('#belln').textContent=j.updates.length;$('#bell').onclick=function(e){e.preventDefault();$('#dbody').innerHTML='<h1 style="font-size:22px">Updates · last 24h</h1>'+(j.updates.length?'<table><tbody>'+j.updates.map(function(x){return '<tr><td><b>'+x.job+'</b></td><td>'+x.text+'</td><td class="muted">'+new Date(x.created*1000).toLocaleString()+'</td></tr>';}).join('')+'</tbody></table>':'<p class="muted">No milestone changes in the last 24 hours.</p>');$('#detail').classList.add('open');};});};loadUpdates();$('#pw').onclick=function(e){e.preventDefault();var o=prompt('Current password'),n=o&&prompt('New password (min 4)');if(n)api('password',{method:'POST',body:{old:o,new:n}}).then(function(){alert('Password changed');}).catch(function(x){alert(x.error||'Failed');});};
 $('#hello').textContent='Hello, '+U.name;$('#role').textContent={admin:'Nedlloyd Admin — full visibility across all clients and jobs',client:U.client+' — all your shipments; you can give your customers read-only access',customer:U.client+' — read-only tracking of jobs assigned to you',employee:'Operations — update milestones on jobs you handle'}[U.role];
 var tabs=[['jobs','Shipments']];if(U.role==='admin')tabs.push(['leads','Leads'],['new','Create job'],['mis','MIS']);if(U.role==='employee')tabs.push(['mis','MIS']);if(U.role==='client')tabs.push(['customers','My customers']);
 $('#tabs').innerHTML=tabs.map(function(t,i){return '<button data-t="'+t[0]+'"'+(i==0?' class="on"':'')+'>'+t[1]+'</button>';}).join('');
 document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('#tabs button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');['jobs','leads','new','customers','mis'].forEach(function(p){$('#panel-'+p).classList.toggle('hidden',p!==b.dataset.t);});if(b.dataset.t==='leads')loadLeads();if(b.dataset.t==='customers')loadCust();if(b.dataset.t==='mis')loadMis();};});
 loadJobs();}).catch(function(){localStorage.removeItem('nl-tok');$('#login').classList.remove('hidden');});}
function bar(s){var h='';for(var i=1;i<=10;i++)h+='<i class="'+(i<s?'d':i===s?'c':'')+'"></i>';return '<div class="bar">'+h+'</div>';}
function loadJobs(){api('jobs').then(function(j){DATA=j;var q=($('#jf').value||'').toLowerCase(),st=$('#js').value;var jobs=j.jobs.filter(function(x){var s=(x.job+' '+x.client+' '+x.customer+' '+x.origin+' '+x.destination+' '+x.mode+' '+x.cargo).toLowerCase();return (!q||s.indexOf(q)>=0)&&(!st||(st==='open'&&x.stage<10)||(st==='transit'&&x.stage>=4&&x.stage<=6)||(st==='delivered'&&x.stage>=9));});var open=jobs.filter(function(x){return x.stage<10;}).length,tr=jobs.filter(function(x){return x.stage>=4&&x.stage<=6;}).length,dl=jobs.filter(function(x){return x.stage>=9;}).length;
 $('#kpis').innerHTML='<div class="kpi"><b>'+jobs.length+'</b><span>Total jobs</span></div><div class="kpi"><b>'+open+'</b><span>Open</span></div><div class="kpi"><b>'+tr+'</b><span>In transit</span></div><div class="kpi"><b>'+dl+'</b><span>Delivered</span></div>';
 $('#jobs').innerHTML=jobs.length?'<table><thead><tr><th>Job</th><th>Route</th><th>Mode / cargo</th><th>Client</th><th>Milestone</th><th></th></tr></thead><tbody>'+jobs.map(function(x){return '<tr><td class="job" data-j="'+x.job+'">'+x.job+'</td><td>'+x.origin+' → '+x.destination+'</td><td>'+x.mode+'<br><span class="muted">'+x.cargo+'</span></td><td>'+x.client+(x.customer?'<br><span class="muted">'+x.customer+'</span>':'')+'</td><td style="min-width:170px">'+bar(x.stage)+'<span class="muted">'+x.stage+'/10 · '+j.milestones[x.stage-1]+'</span></td><td><button class="btn s xs" data-j="'+x.job+'">Details</button>'+((U.role==='admin'||U.role==='employee')&&x.stage<10?' <button class="btn xs adv" data-j="'+x.job+'">Advance →</button>':'')+'</td></tr>';}).join('')+'</tbody></table>':'<p class="muted">No jobs yet.</p>';
 document.querySelectorAll('[data-j]').forEach(function(b){b.onclick=function(){if(b.classList.contains('adv')){api('jobs/'+b.dataset.j+'/advance',{method:'POST',body:{}}).then(function(){loadJobs();loadUpdates();});}else showJob(b.dataset.j);};});});}
function showJob(id){var x=DATA.jobs.filter(function(j){return j.job===id;})[0];if(!x)return;$('#dbody').innerHTML='<h1 style="font-size:22px">'+x.job+'</h1><p class="sub">'+x.origin+' → '+x.destination+' · '+x.mode+' · '+x.cargo+'<br>'+x.client+(x.customer?' · '+x.customer:'')+'</p><div class="tl">'+DATA.milestones.map(function(m,i){var k=i+1;return '<i class="'+(k<x.stage?'d':k===x.stage?'c':'')+'">'+k+'</i><div><b>'+m+'</b>'+(x.dates[i]?'<div class="muted">'+x.dates[i]+'</div>':'')+'</div><div class="doc">'+(DATA.docs[i]?(k<=x.stage?'<a href="#" onclick="return false">⬇ '+DATA.docs[i]+'</a>':DATA.docs[i]+' (pending)'):'')+'</div>';}).join('')+'</div>'+'<p style="margin-top:14px"><button class="btn s xs" onclick="window.print()">🖨 Print job sheet</button> <a class="btn s xs" target="_blank" href="https://wa.me/919910694210?text='+encodeURIComponent('Query on job '+x.job)+'">WhatsApp about this job</a></p><h2 style="font-size:14px">Notes & activity</h2><div id="notes" class="muted">Loading…</div><form id="nf" style="display:flex;gap:8px;margin-top:8px"><input name="text" placeholder="Add a note for this job…" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;font:13px inherit"><button class="btn xs">Add</button></form>';$('#detail').classList.add('open');loadNotes(x.job);}
function loadNotes(id){api('jobs/'+id+'/notes').then(function(j){$('#notes').innerHTML=j.notes.length?j.notes.map(function(n){return '<div style="padding:6px 0;border-bottom:1px solid var(--line)">'+(n.kind==='event'?'⚑ ':'💬 ')+n.text+' <span class="muted">— '+n.author+', '+new Date(n.created*1000).toLocaleString()+'</span></div>';}).join(''):'No notes yet.';});$('#nf').onsubmit=function(e){e.preventDefault();var t=e.target.text.value.trim();if(!t)return;api('jobs/'+id+'/notes',{method:'POST',body:{text:t}}).then(function(){e.target.reset();loadNotes(id);});};}
$('#detail .x').onclick=function(){$('#detail').classList.remove('open');};$('#detail').onclick=function(e){if(e.target.id==='detail')$('#detail').classList.remove('open');};
function loadLeads(){api('leads').then(function(j){$('#leads').innerHTML=j.leads.length?'<table><thead><tr><th>Ref</th><th>Contact</th><th>Request</th><th>Status</th></tr></thead><tbody>'+j.leads.map(function(l){var d=l.data;return '<tr><td><b>'+l.ref+'</b><br><span class="muted">'+new Date(l.created*1000).toLocaleString()+'</span></td><td>'+(d.name||'')+'<br><span class="muted">'+(d.company||'')+'<br>'+(d.email||'')+' · '+(d.phone||'')+'</span></td><td>'+(d.mode||'')+' · '+(d.origin||'?')+' → '+(d.destination||'?')+'<br><span class="muted">'+(d.cargo||'')+' '+(d.message||'')+'</span></td><td><select data-l="'+l.id+'">'+['new','contacted','quoted','won','lost'].map(function(s){return '<option'+(s===l.status?' selected':'')+'>'+s+'</option>';}).join('')+'</select></td></tr>';}).join('')+'</tbody></table>':'<p class="muted">No leads yet — quote requests from the website land here.</p>';
 document.querySelectorAll('[data-l]').forEach(function(s){s.onchange=function(){api('leads/'+s.dataset.l+'/status',{method:'POST',body:{status:s.value}});};});});}
$('#newjob').onsubmit=function(e){e.preventDefault();var d={};new FormData(e.target).forEach(function(v,k){d[k]=v;});api('jobs',{method:'POST',body:d}).then(function(j){alert('Created '+j.job);e.target.reset();document.querySelector('#tabs button').click();loadJobs();});};
function loadCust(){api('customers').then(function(j){$('#customers').innerHTML=j.customers.length?'<table><thead><tr><th>Name</th><th>User ID</th><th>Access</th></tr></thead><tbody>'+j.customers.map(function(c){return '<tr><td>'+c.name+'</td><td>'+c.username+'</td><td><span class="pill g">read-only</span></td></tr>';}).join('')+'</tbody></table>':'<p class="muted">No customer logins yet.</p>';});}
$('#newcust').onsubmit=function(e){e.preventDefault();var d={};new FormData(e.target).forEach(function(v,k){d[k]=v;});api('customers',{method:'POST',body:d}).then(function(){e.target.reset();loadCust();}).catch(function(x){alert(x.error||'Failed');});};
function loadMis(){api('stats').then(function(s){$('#mis').innerHTML='<div class="cards"><div class="kpi"><b>'+s.jobs+'</b><span>Jobs</span></div><div class="kpi"><b>'+s.open+'</b><span>Open</span></div><div class="kpi"><b>'+s.delivered+'</b><span>Delivered</span></div><div class="kpi"><b>'+s.leads+'</b><span>New leads</span></div><div class="kpi"><b>'+s.hits7d+'</b><span>Site visits · 7d</span></div><div class="kpi"><b>'+s.chats+'</b><span>AI chats</span></div></div><h2>Jobs by mode</h2><table><tbody>'+s.by_mode.map(function(r){return '<tr><td>'+r.mode+'</td><td>'+r.n+'</td></tr>';}).join('')+'</tbody></table><h2>Jobs by client</h2><table><tbody>'+s.by_client.map(function(r){return '<tr><td>'+r.client+'</td><td>'+r.n+'</td></tr>';}).join('')+'</tbody></table><h2>Top pages (7d)</h2><table><tbody>'+s.top_pages.map(function(r){return '<tr><td>'+r.page+'</td><td>'+r.n+'</td></tr>';}).join('')+'</tbody></table>';});}
(function(){try{document.documentElement.setAttribute('data-nl-theme',localStorage.getItem('nl-theme')||'white');}catch(e){}})();
document.getElementById('csv').onclick=function(e){e.preventDefault();fetch('/api/jobs.csv',{headers:{'Authorization':'Bearer '+T}}).then(function(r){return r.blob();}).then(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nedlloyd-jobs.csv';a.click();});};
$('#jf').oninput=function(){if(DATA)loadJobs();};$('#js').onchange=function(){if(DATA)loadJobs();};
if(T)boot();else $('#login').classList.remove('hidden');
</script></body></html>
