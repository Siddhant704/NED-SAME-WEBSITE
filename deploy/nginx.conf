server {
    listen 80;
    server_name nedlloydgroup.com www.nedlloydgroup.com;
    client_max_body_size 20m;
    location = / { return 302 /nedlloydgroup.com/; }
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
